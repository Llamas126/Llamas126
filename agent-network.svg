<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#238636"/>
    </radialGradient>
  </defs>

  <rect width="760" height="300" rx="14" fill="#0d1117"/>

  <!-- pulsing core node: "the agent" -->
  <circle cx="380" cy="150" r="26" fill="url(#core)">
    <animate attributeName="r" values="26;31;26" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="150" r="26" fill="none" stroke="#7ee787" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="26;55;26" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0d1117" font-weight="bold">n8n</text>

  <!-- orbiting satellites, rotating as a group -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 150" to="360 380 150" dur="24s" repeatCount="indefinite"/>

    <!-- satellite 1 -->
    <g transform="rotate(0 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="3s" begin="0s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    </g>

    <!-- satellite 2 -->
    <g transform="rotate(60 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#f0883e;#30363d" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    </g>

    <!-- satellite 3 -->
    <g transform="rotate(120 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#a371f7;#30363d" dur="3s" begin="1s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    </g>

    <!-- satellite 4 -->
    <g transform="rotate(180 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#ffca28;#30363d" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#ffca28" stroke-width="2"/>
    </g>

    <!-- satellite 5 -->
    <g transform="rotate(240 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#7ee787;#30363d" dur="3s" begin="2s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    </g>

    <!-- satellite 6 -->
    <g transform="rotate(300 380 150)">
      <line x1="380" y1="150" x2="380" y2="55" stroke="#30363d" stroke-width="1.5">
        <animate attributeName="stroke" values="#30363d;#ff7b72;#30363d" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="380" cy="55" r="14" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    </g>
  </g>

  <!-- static legend, stays upright regardless of rotation -->
  <g font-family="Consolas, monospace" font-size="12" fill="#8b949e">
    <circle cx="40" cy="255" r="5" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="52" y="259">React / TS</text>
    <circle cx="160" cy="255" r="5" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="172" y="259">Firebase</text>
    <circle cx="270" cy="255" r="5" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="282" y="259">n8n Agents</text>
    <circle cx="400" cy="255" r="5" fill="#161b22" stroke="#ffca28" stroke-width="2"/>
    <text x="412" y="259">Java/Spring</text>
    <circle cx="530" cy="255" r="5" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <text x="542" y="259">Security</text>
    <circle cx="630" cy="255" r="5" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="642" y="259">Data / Python</text>
  </g>
</svg>
